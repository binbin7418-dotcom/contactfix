name: build-windows
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyinstaller
      - name: Build
        run: pyinstaller contactfix.spec
      - name: Package
        run: Compress-Archive -Path dist/ContactFix -DestinationPath ContactFix-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ContactFix-Windows
          path: ContactFix-Windows.zip
